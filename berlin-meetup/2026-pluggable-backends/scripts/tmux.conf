# tmux for the demo terminal (scripts/ttyd.sh). Every ttyd client (main slide, presenter view,
# next-slide preview) attaches to the same session, so typing in one shows up in all of them.
set -g status off
# Leave the mouse to xterm.js: drag selects and ttyd copies it to the system clipboard.
set -g mouse off
set -g default-terminal tmux-256color
set -g escape-time 0
set -g history-limit 10000
# Slidev scales slides with CSS transforms, so all clients have the same size anyway.
# If they ever differ, keep the audience view (the largest one) complete.
set -g window-size largest
